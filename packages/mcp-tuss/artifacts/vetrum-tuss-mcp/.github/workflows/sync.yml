name: Weekly TUSS Sync Check

on:
  schedule:
    # Toda segunda-feira às 06:00 UTC (03:00 BRT)
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Forçar sincronização completa (--force)"
        required: false
        default: "false"
        type: boolean

jobs:
  sync-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run sync check
        env:
          MCPASSURE_DB_PATH: /tmp/tuss-sync-check.db
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            node dist/scripts/sync.js --force
          else
            node dist/scripts/sync.js
          fi

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Falha na sincronização semanal TUSS',
              body: `A sincronização automática semanal falhou em ${new Date().toISOString()}.\n\nWorkflow: ${context.workflow}\nRun: ${context.runId}\n\nVerifique se as URLs da ANS mudaram ou se há indisponibilidade do portal.`,
              labels: ['bug', 'sync']
            })
