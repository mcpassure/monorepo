name: CI

# Roda em PRs e push pra main.
# Bloqueia merge se aparecer vulnerabilidade high+ ou se qualquer step quebrar.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Typecheck, Audit, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Security audit (bloqueia em high+)
        # --audit-level=high → ignora low/moderate, bloqueia em high/critical.
        # Roda ANTES de lint/test pra falhar fast em CVE conhecida.
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
