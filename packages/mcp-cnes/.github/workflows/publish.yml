name: Publish

# Trigger manual apenas — evita publicações acidentais antes
# da Onda 1 estar completa. Para publicar:
#   1. Garanta que secrets.NPM_TOKEN está configurada no repo
#   2. Acesse Actions → Publish → Run workflow → escolha a tag
# Quando a Onda 1 (CNES + Bulário + TUSS) estiver validada e
# pronta para lançamento, trocar de volta para:
#   on:
#     push:
#       tags: ["v*"]

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (ex: v1.1.2). Deve existir no repositório."
        required: true
        type: string

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: actions/github-script@v8
        with:
          script: |
            const tag = '${{ github.event.inputs.tag }}';
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              draft: false,
              prerelease: tag.includes('-')
            });
